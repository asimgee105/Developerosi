version: '3.8'

services:
  # 1. MySQL Database (User's Preferred Database)
  db:
    image: mysql:8.0
    container_name: devos_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: devos_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: secure_password_123
      MYSQL_ROOT_PASSWORD: secure_password_123
    ports:
      - "3306:3306"
    volumes:
      - devos_db_data:/var/lib/mysql

  # 2. Redis (High-Performance Caching & Queues)
  redis:
    image: redis:7-alpine
    container_name: devos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - devos_redis_data:/data

  # 3. Laravel Backend (API & Core Logic)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devos_laravel
    restart: unless-stopped
    working_dir: /app
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=devos_db
      - DB_USERNAME=admin
      - DB_PASSWORD=secure_password_123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis

  # 4. Vue/Nuxt Frontend (User Interface)
  frontend:
    image: node:22-alpine
    container_name: devos_vue
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      - backend

# Persistent Storage Volumes
volumes:
  devos_db_data:
  devos_redis_data:
